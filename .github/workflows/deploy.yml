name: Deploy NestJS Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/test-project-for-github
            # pull latest code
            git clone https://github.com/amadirfan-xs/test-project-for-github.git . || git pull
            # stop old containers
            docker compose down || true
            # build + run with compose
            docker compose up -d --build